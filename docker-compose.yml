services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: caps2tone
      POSTGRES_USER: caps2tone
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Set LOCAL_DATABASE_PASSWORD in your shell}
    volumes:
      - caps2tone_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caps2tone -d caps2tone"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  caps2tone_pg:
